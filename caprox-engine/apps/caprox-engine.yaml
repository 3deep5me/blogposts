apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-api-operator-caprox-engine
  namespace: argocd 
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
# we need more tries because the operator needs time to reconcile the resources
operation:
  retry:
    limit: 10
spec:
  destination:
    namespace: capi-operator-system
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/3deep5me/cluster-api-provider-proxmox-ionos.git
    targetRevision: d6317496f9075fab41d0072c6695bfbb23e9d2a3
    path: templates/clusterclass-cilium-with-shared-ippool/base
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated: 
      prune: true
      selfHeal: true